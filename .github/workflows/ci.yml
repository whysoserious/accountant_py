name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and linting are version-independent and take seconds, so they
  # run once and gate the matrix below -- cheapest failure first.
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: black
        run: black --check --diff .

      - name: flake8
        run: flake8 .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version, not just the first.
      fail-fast: false
      matrix:
        # The matrix is deliberately wide. A missing `Set` import in
        # imap_client's annotations was invisible on 3.14, where PEP 649 defers
        # annotation evaluation, but raised NameError on import for 3.13 and
        # earlier. Testing a single version is what hid it.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: pytest
        run: pytest
