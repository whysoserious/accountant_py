[tool.black]
# CLAUDE.md specifies a 100-character maximum line length.
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repository root on sys.path so tests import the top-level modules
# (this project keeps its modules at the root rather than in a package).
pythonpath = ["."]
addopts = "-q --strict-markers"
